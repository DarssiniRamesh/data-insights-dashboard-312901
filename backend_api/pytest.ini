[pytest]
minversion = 8.0
addopts = -ra -q
testpaths = tests
pythonpath = src
asyncio_mode = auto
markers =
    unit: Unit tests (no network, no real DB)
    api: API tests for FastAPI endpoints (ASGI, no server)
    integration: Integration tests (DB, multi-component)
    frd: Tests traceable to FRD requirements
    nfr: Tests traceable to NFR requirements

[tool:pytest]
anyio_backends = asyncio
